<!doctype html>
<html lang="en">
  <head>
    <!-- Essential Meta Tags -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Title -->
    <title>Elite International Trading Co. | Global Exporters from Aligarh, India</title>

    <!-- Meta Description -->
    <meta
      name="description"
      content="Elite International Trading Co., Aligarh — a trusted global exporter of premium agricultural products, food items, garments, and industrial goods. Committed to excellence, quality, and international trade standards."
    />

    <!-- Keywords -->
    <meta
      name="keywords"
      content="Elite International Trading Company Aligarh, export company India, rice exporters, basmati rice, saffron exporters, global trading, coffee exporters, spice suppliers, agricultural export, garment exporters, Elite International Co."
    />

    <!-- Author -->
    <meta name="author" content="Elite International Trading Co." />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.eliteinternationalco.com/" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./src/assets/home/logo.jpg" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.eliteinternationalco.com/" />
    <meta property="og:title" content="Elite International Trading Co. | Premium Exporters from Aligarh" />
    <meta
      property="og:description"
      content="Elite International Trading Co., Aligarh — your global partner in export and trade of premium rice, coffee, saffron, garments, and more."
    />
    <meta property="og:image" content="https://www.eliteinternationalco.com/og-image.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.eliteinternationalco.com/" />
    <meta name="twitter:title" content="Elite International Trading Co. | Exporters & Suppliers" />
    <meta
      name="twitter:description"
      content="Elite International Trading Co., Aligarh — exporters of rice, coffee, spices, and garments with global standards of quality and service."
    />
    <meta name="twitter:image" content="https://www.eliteinternationalco.com/og-image.jpg" />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#C62828" />

    <!-- Structured Data (JSON-LD for Google Rich Snippets) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Elite International Trading Co.",
        "url": "https://www.eliteinternationalco.com/",
        "logo": "https://www.eliteinternationalco.com/elite-logo.png",
        "description": "Elite International Trading Co. is a leading export company based in Aligarh, India, offering premium rice, coffee, saffron, spices, garments, and more.",
        "foundingDate": "2010",
        "founder": "Elite International Trading Co.",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Aligarh, Uttar Pradesh, India",
          "addressLocality": "Aligarh",
          "addressCountry": "IN"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+91-XXXXXXXXXX",
          "contactType": "Customer Service",
          "email": "info@theeliteco.com"
        },
        "sameAs": [
          "https://www.facebook.com/eliteinternationalco",
          "https://www.linkedin.com/company/eliteinternationalco",
          "https://www.instagram.com/eliteinternationalco"
        ]
      }
    </script>

    <!-- Fonts & Styles (optional, SEO-safe) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
